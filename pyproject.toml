[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helldivers-stratagems"
version = "1.0.0"
description = "OCR stratagem wheel that types Helldivers 2 stratagem codes with ordinary keypresses."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pynput>=1.7.7",
    "mss>=9.0.1",
    "pytesseract>=0.3.10",
    "rapidfuzz>=3.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
helldivers-stratagems = "stratagems.__main__:main"

[tool.setuptools.packages.find]
include = ["stratagems*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
